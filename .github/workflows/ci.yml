name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: bash scripts/lint.sh

      - name: Build (placeholder — no app code in Sprint 1)
        run: echo "build step wired; no buildable app code until Sprint 2+"

      - name: Test
        run: bash scripts/test.sh

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high || echo "::warning::Non-blocking in Sprint 1 — see docs/security/SECURITY_BASELINE.md"

  artifact:
    name: Artifact Generation (structure only)
    needs: quality-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder artifact step
        run: echo "Artifact packaging pipeline wired; nothing to package until Sprint 2+ produces build output."
