# Local development infrastructure only. Not used in staging/production.
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hmb_postgres_dev
    environment:
      POSTGRES_USER: hmb_dev
      POSTGRES_PASSWORD: hmb_dev_password
      POSTGRES_DB: hmb_ecommerce_dev
    ports:
      - "5432:5432"
    volumes:
      - hmb_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hmb_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - hmb_redis_data:/data

  storage:
    image: minio/minio:latest
    container_name: hmb_storage_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-access-key
      MINIO_ROOT_PASSWORD: local-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hmb_storage_data:/data

  mail:
    image: mailhog/mailhog:latest
    container_name: hmb_mail_dev
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  hmb_postgres_data:
  hmb_redis_data:
  hmb_storage_data:
