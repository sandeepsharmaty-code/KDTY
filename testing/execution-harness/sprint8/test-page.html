<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="colors.css">
<style>
  body { font-family: sans-serif; }
  .btn-primary {
    background-color: var(--color-primary-plum);
    color: var(--color-neutral-white);
    padding: 12px 24px;
    border: none;
    border-radius: 4px;
  }
  .price { color: var(--color-primary-rose); font-weight: bold; }
</style>
</head>
<body>
  <button class="btn-primary" id="cta">Add to Cart</button>
  <span class="price" id="price">$18.00</span>
  <img id="product-img" alt="Muse Rose Nail Lacquer bottle on a marble surface" width="10" height="10" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7">
  <a href="/cart" id="cart-link">View Cart</a>
</body>
</html>
